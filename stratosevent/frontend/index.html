<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StratosEvent — Events</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ── Navigation ───────────────────────────────────────────── -->
<nav class="nav-main">
  <div class="nav-inner">
    <a class="nav-brand" href="index.html">⬡ Stratos<span>Event</span></a>
    <div class="nav-links">
      <a href="index.html" class="active"><span>Events</span></a>
      <a href="pages/register.html"><span>Register</span></a>
      <a href="pages/admin-dashboard.html"><span>Dashboard</span></a>
      <a href="pages/admin-approval.html"><span>Approvals</span></a>
    </div>
  </div>
</nav>

<!-- ── Page Content ─────────────────────────────────────────── -->
<div class="page-wrapper">
  <div class="page-header">
    <h1>Upcoming Events</h1>
    <p>Browse and register for conferences, workshops, webinars, and seminars.</p>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <input type="search" id="searchInput" class="form-control search-input" placeholder="Search events…" />
    <select id="categoryFilter" class="form-control" style="max-width:180px">
      <option value="">All Categories</option>
      <option>Conference</option>
      <option>Workshop</option>
      <option>Webinar</option>
      <option>Seminar</option>
    </select>
    <select id="statusFilter" class="form-control" style="max-width:150px">
      <option value="">All Status</option>
      <option>Active</option>
      <option>Completed</option>
      <option>Cancelled</option>
    </select>
  </div>

  <!-- Events Grid -->
  <div id="eventsContainer">
    <div class="page-loader">
      <div class="loader"></div>
      <span>Loading events…</span>
    </div>
  </div>
</div>

<!-- ── Registration Modal ────────────────────────────────────── -->
<div class="modal-overlay" id="registerModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Register for Event</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalEventInfo" style="margin-bottom:1.25rem;padding:0.875rem;background:var(--bg-surface);border-radius:var(--radius);border:1px solid var(--border);font-size:0.875rem;"></div>
    <div id="regAlert"></div>
    <form id="regForm" novalidate>
      <input type="hidden" id="regEventId" />
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="regName">Full Name *</label>
          <input class="form-control" id="regName" type="text" placeholder="Your full name" required />
          <div class="form-feedback error" id="regNameErr"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="regEmail">Email *</label>
          <input class="form-control" id="regEmail" type="email" placeholder="you@example.com" required />
          <div class="form-feedback error" id="regEmailErr"></div>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="regPhone">Phone *</label>
          <input class="form-control" id="regPhone" type="tel" placeholder="9876543210" required />
          <div class="form-feedback error" id="regPhoneErr"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="regDept">Department</label>
          <input class="form-control" id="regDept" type="text" placeholder="e.g. Engineering" />
        </div>
      </div>
      <div style="display:flex;gap:0.75rem;margin-top:0.5rem">
        <button type="submit" class="btn btn-primary btn-lg" id="regSubmitBtn" style="flex:1">Submit Registration</button>
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  let allEvents = [];

  // ── Load Events ──────────────────────────────────────────────
  async function loadEvents() {
    try {
      const { data } = await api.get("/events");
      allEvents = data;
      renderEvents(data);
    } catch (err) {
      document.getElementById("eventsContainer").innerHTML =
        `<div class="alert alert-error">Failed to load events: ${err.message}</div>`;
    }
  }

  function renderEvents(events) {
    const container = document.getElementById("eventsContainer");
    if (!events.length) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">⬡</div><p>No events found matching your filters.</p></div>`;
      return;
    }
    container.innerHTML = `<div class="grid-3">${events.map(eventCard).join("")}</div>`;
  }

  function eventCard(e) {
    const full = e.available_seats === 0;
    return `
      <div class="card card-event">
        <div class="event-header">
          <h3>${e.title}</h3>
          ${statusBadge(e.status)}
        </div>
        <div class="event-meta">
          <span>📅 ${formatDate(e.event_date)} at ${formatTime(e.event_time)}</span>
          <span>📍 ${e.venue}</span>
          ${categoryBadge(e.category)}
        </div>
        <p style="font-size:0.8125rem;color:var(--text-secondary);line-height:1.5;margin-bottom:1rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">
          ${e.description}
        </p>
        <footer>
          ${seatBadge(e.available_seats, e.total_seats)}
          <button class="btn btn-primary btn-sm"
            ${full || e.status !== 'Active' ? 'disabled' : ''}
            onclick="openRegModal(${e.id})">
            ${full ? 'Full' : e.status !== 'Active' ? e.status : 'Register →'}
          </button>
        </footer>
      </div>`;
  }

  // ── Filters ──────────────────────────────────────────────────
  function applyFilters() {
    const q    = document.getElementById("searchInput").value.toLowerCase();
    const cat  = document.getElementById("categoryFilter").value;
    const stat = document.getElementById("statusFilter").value;
    const filtered = allEvents.filter(e =>
      (!q    || e.title.toLowerCase().includes(q) || e.venue.toLowerCase().includes(q)) &&
      (!cat  || e.category === cat) &&
      (!stat || e.status   === stat)
    );
    renderEvents(filtered);
  }

  document.getElementById("searchInput").addEventListener("input", applyFilters);
  document.getElementById("categoryFilter").addEventListener("change", applyFilters);
  document.getElementById("statusFilter").addEventListener("change", applyFilters);

  // ── Registration Modal ───────────────────────────────────────
  function openRegModal(eventId) {
    const ev = allEvents.find(e => e.id === eventId);
    if (!ev) return;
    document.getElementById("regEventId").value = eventId;
    document.getElementById("modalEventInfo").innerHTML = `
      <strong style="color:var(--text-primary)">${ev.title}</strong><br>
      <span style="color:var(--text-secondary)">📅 ${formatDate(ev.event_date)} · 📍 ${ev.venue}</span>
    `;
    document.getElementById("regAlert").innerHTML = "";
    document.getElementById("regForm").reset();
    document.getElementById("registerModal").classList.add("open");
  }

  function closeModal() {
    document.getElementById("registerModal").classList.remove("open");
  }

  document.getElementById("registerModal").addEventListener("click", (e) => {
    if (e.target === e.currentTarget) closeModal();
  });

  // ── Frontend Validation ──────────────────────────────────────
  function validateRegForm() {
    let valid = true;
    const fields = [
      { id: "regName",  err: "regNameErr",  test: v => v.trim().length >= 2,                   msg: "Name must be at least 2 characters." },
      { id: "regEmail", err: "regEmailErr", test: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),  msg: "Enter a valid email address." },
      { id: "regPhone", err: "regPhoneErr", test: v => /^[0-9\s\-\+]{7,15}$/.test(v),         msg: "Enter a valid phone number." },
    ];
    fields.forEach(({ id, err, test, msg }) => {
      const val = document.getElementById(id).value;
      const errEl = document.getElementById(err);
      if (!test(val)) {
        document.getElementById(id).classList.add("is-invalid");
        errEl.textContent = msg; valid = false;
      } else {
        document.getElementById(id).classList.remove("is-invalid");
        errEl.textContent = "";
      }
    });
    return valid;
  }

  // ── Submit Registration ──────────────────────────────────────
  document.getElementById("regForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!validateRegForm()) return;
    setLoading("regSubmitBtn", true);
    try {
      const payload = {
        event_id:   +document.getElementById("regEventId").value,
        full_name:  document.getElementById("regName").value,
        email:      document.getElementById("regEmail").value,
        phone:      document.getElementById("regPhone").value,
        department: document.getElementById("regDept").value,
      };
      const res = await api.post("/registrations", payload);
      showAlert("regAlert", "success", res.message);
      document.getElementById("regForm").reset();
      setTimeout(closeModal, 2500);
    } catch (err) {
      showAlert("regAlert", "error", err.message);
    } finally {
      setLoading("regSubmitBtn", false, "Submit Registration");
    }
  });

  loadEvents();
</script>
</body>
</html>
